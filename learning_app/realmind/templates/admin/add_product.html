{% extends "admin/admin_base.html" %}

{% block title %}Add Product{% endblock %}

{% block content %}
<div class="container my-5">
  <h2>Add New Product</h2>
  <form method="POST" enctype="multipart/form-data">
    <input type="hidden" name="csrf_token" value="{{ csrf_token}}">

    <div class="mb-3">
      <label for="name" class="form-label">Product Name</label>
      <input type="text" name="name" id="name" class="form-control" required>
    </div>

    <div class="mb-3">
      <label for="description" class="form-label">Description</label>
      <textarea name="description" id="description" rows="4" class="form-control" required></textarea>
    </div>

    <div class="mb-3">
      <label for="price" class="form-label">Price (₵)</label>
      <input type="number" step="0.01" name="price" id="price" class="form-control" required>
    </div>

    <div class="mb-3">
      <label for="discount_percentage" class="form-label">Discount (%)</label>
      <input type="number" name="discount_percentage" class="form-control" placeholder="e.g. 20 for 20% off">
    </div>

    <div class="mb-3">
      <label for="image" class="form-label">Product Image</label>
      <input type="file" name="image" id="image" class="form-control" accept="image/*" required>
    </div>

    <!-- Category -->
    <div class="mb-3">
      <label for="category_name" class="form-label">Category</label>
      <input type="text" name="category_name" id="category_name" class="form-control" placeholder="e.g. Books, Electronics" required>
    </div>

    <!-- New Fields -->
    <div class="row">
      <div class="col-md-6 mb-3">
        <label for="author" class="form-label">Author</label>
        <input type="text" name="author" id="author" class="form-control">
      </div>

      <div class="col-md-6 mb-3">
        <label for="brand" class="form-label">Brand</label>
        <input type="text" name="brand" id="brand" class="form-control">
      </div>

      <div class="col-md-4 mb-3">
        <label for="grade" class="form-label">Grade</label>
        <input type="text" name="grade" id="grade" class="form-control">
      </div>

      <div class="col-md-4 mb-3">
        <label for="level" class="form-label">Level</label>
        <input type="text" name="level" id="level" class="form-control">
      </div>

      <div class="col-md-4 mb-3">
        <label for="subject" class="form-label">Subject</label>
        <input type="text" name="subject" id="subject" class="form-control">
      </div>

      <div class="col-md-6 mb-3">
        <label for="curriculum" class="form-label">Curriculum</label>
        <select name="curriculum" id="curriculum" class="form-select"
                onchange="document.getElementById('curriculum_other_wrap')
                          .classList.toggle('d-none', this.value !== 'Other')">
          <option value="">— Select curriculum —</option>
          <option value="GES New Curriculum">GES New Curriculum</option>
          <option value="GES Old Curriculum">GES Old Curriculum</option>
          <option value="BECE">BECE</option>
          <option value="WASSCE">WASSCE</option>
          <option value="Cambridge">Cambridge (IGCSE / AS / A-Level)</option>
          <option value="IB">IB (International Baccalaureate)</option>
          <option value="Montessori">Montessori</option>
          <option value="Other">Other</option>
        </select>
      </div>

      <div class="col-md-6 mb-3 d-none" id="curriculum_other_wrap">
        <label for="curriculum_other" class="form-label">Specify Curriculum</label>
        <input type="text" name="curriculum_other" id="curriculum_other"
               class="form-control" placeholder="e.g. Waldorf, National TVET…">
      </div>
    </div>

    <!-- Stock Status -->
    <div class="mb-3">
      <label class="form-label">Stock Status</label><br>
      <div class="form-check form-check-inline">
        <input class="form-check-input" type="radio" name="in_stock" id="in_stock_yes" value="true" checked>
        <label class="form-check-label" for="in_stock_yes">In Stock</label>
      </div>
      <div class="form-check form-check-inline">
        <input class="form-check-input" type="radio" name="in_stock" id="in_stock_no" value="false">
        <label class="form-check-label" for="in_stock_no">Out of Stock</label>
      </div>
    </div>

    <!-- Source — admin eyes only, never shown on the public site -->
    <div class="mb-4 p-3 border rounded" style="background:#f8f9fa;">
      <label for="source" class="form-label fw-semibold">
        <i class="fas fa-lock me-1 text-secondary"></i>
        Source
        <span class="badge bg-secondary ms-2" style="font-size:0.7rem;">Admin only</span>
      </label>
      <textarea name="source" id="source" rows="2" class="form-control"
                placeholder="e.g. Ghana Education Service, Publisher name, Supplier contact…"></textarea>
      <div class="form-text">This information is stored internally and is never displayed on the website.</div>
    </div>

    <button type="submit" class="btn btn-primary">Add Product</button>
  </form>
</div>
{% endblock %}
